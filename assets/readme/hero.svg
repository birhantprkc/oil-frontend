<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">oil-ux</title>
  <desc id="desc">一套帮助 Agent 删除界面噪声、校正任务与数据作用域，并修复共享实现的 UX 契约。</desc>

  <rect x="1" y="1" width="1198" height="418" rx="28" fill="#F6F4EE" stroke="#D8D5CB" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g id="title-block" transform="translate(64 54)">
      <text x="0" y="0" fill="#27624C" font-size="18" font-weight="700" letter-spacing="2.4">AGENT UX CONTRACTS</text>
      <text x="0" y="83" fill="#171917" font-size="82" font-weight="760" letter-spacing="-3">oil-ux</text>
      <text x="2" y="137" fill="#30332F" font-size="30" font-weight="600">删掉无用内容，</text>
      <text x="2" y="178" fill="#30332F" font-size="30" font-weight="600">修正真正出错的位置。</text>

      <line x1="2" y1="225" x2="520" y2="225" stroke="#CFCCC2" stroke-width="2"/>
      <text x="2" y="263" fill="#686D67" font-size="18"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FLOW  /  SCOPE  /  INFORMATION  /  COMPONENTS</text>
      <text x="2" y="307" fill="#171917" font-size="20" font-weight="650">只在明确点名时启用</text>
      <circle cx="230" cy="300" r="5" fill="#27624C"/>
      <text x="248" y="307" fill="#686D67" font-size="18">中文 Agent Skill</text>
    </g>

    <line x1="650" y1="48" x2="650" y2="372" stroke="#D8D5CB" stroke-width="2"/>

    <g id="decision-filter" transform="translate(704 55)">
      <text x="0" y="0" fill="#686D67" font-size="18" font-weight="700" letter-spacing="1.8">FROM NOISE TO DECISION</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">
        <text x="0" y="49" fill="#858A84">uuid: 4f9b-82d1-...</text>
        <line x1="-3" y1="42" x2="226" y2="42" stroke="#C9573E" stroke-width="3"/>
        <text x="0" y="88" fill="#858A84">3 selected</text>
        <line x1="-3" y1="81" x2="145" y2="81" stroke="#C9573E" stroke-width="3"/>
        <text x="0" y="127" fill="#858A84">AI magic</text>
        <line x1="-3" y1="120" x2="123" y2="120" stroke="#C9573E" stroke-width="3"/>
      </g>

      <text x="304" y="88" fill="#C9573E" font-size="18" font-weight="750" letter-spacing="1.4">DELETE NOISE</text>
      <path d="M262 81 H287" fill="none" stroke="#C9573E" stroke-width="2.5"/>
      <path d="M281 74 L288 81 L281 88" fill="none" stroke="#C9573E" stroke-width="2.5"/>

      <line x1="0" y1="161" x2="430" y2="161" stroke="#CFCCC2" stroke-width="2"/>

      <g id="rule-map">
        <text x="0" y="202" fill="#27624C" font-size="18" font-weight="750" letter-spacing="1.2">01  TASK</text>
        <text x="0" y="234" fill="#171917" font-size="22" font-weight="650">用户要完成什么</text>

        <text x="238" y="202" fill="#27624C" font-size="18" font-weight="750" letter-spacing="1.2">02  SCOPE</text>
        <text x="238" y="234" fill="#171917" font-size="22" font-weight="650">动作影响谁</text>

        <line x1="0" y1="263" x2="430" y2="263" stroke="#E0DDD4" stroke-width="2"/>

        <text x="0" y="304" fill="#27624C" font-size="18" font-weight="750" letter-spacing="1.2">03  STRUCTURE</text>
        <text x="0" y="336" fill="#171917" font-size="22" font-weight="650">信息与动作怎么排</text>

        <text x="238" y="304" fill="#27624C" font-size="18" font-weight="750" letter-spacing="1.2">04  SOURCE</text>
        <text x="238" y="336" fill="#171917" font-size="22" font-weight="650">真正应修改哪里</text>
      </g>
    </g>
  </g>
</svg>
